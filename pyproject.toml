[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-contract"
version = "0.1.0"
description = "KPI-as-code: YAML metric contracts validated by execution against SQLite, generating a measure dictionary and Power BI DAX stubs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vishal Sharma" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["metrics", "kpi", "semantic-layer", "power-bi", "dax", "sqlite", "data-quality"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Database",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mc = "metric_contract.cli:main"

[tool.setuptools]
packages = ["metric_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
